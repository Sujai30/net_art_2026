<h1><font color="#fbbf24" size="7">MEMORY</font></h1>
<h2>Goodbye</h2>
<br>
<p>Hospital light. Or maybe just the idea of it.</p>
<p>Your family’s voices are careful, as if volume could break you more.</p>
<p><font color="#34d399" size="5">A hand holds yours.</font></p>
<p><mark>“We’re here.”</mark> <em>“It’s okay.”</em> <strong>“I love you.”</strong></p>
<p>No one says the word dead.</p>
<p>But it sits in the room anyway.</p>
