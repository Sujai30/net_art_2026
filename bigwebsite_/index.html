<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>half-court wormhole physics (bad)</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <main id="universe">

    <div class="mission-panel" style="top: 60px; left: 70px;">
      <h1 class="title">Shooting shots in 2030</h1>
      <p class="subtitle">
         <span class="chip">looped</span>
      </p>
    </div>

    <section id="launchpad" class="zone">
      <div class="statboard">
        <div class="row"><span class="k">shot</span><span class="v" id="shotType">3pt</span></div>
        <div class="row"><span class="k">law of physics</span><span class="v">optional</span></div>
        <div class="row"><span class="k">status</span><span class="v">follow the ball</span></div>
      </div>

      <img id="steph" src="img/steph.jpeg" alt="steph shooting" />

      <div class="scribble" style="left: 120px; top: 980px;">
        .
      </div>
    </section>


    <section id="portal" class="zone">
      <img id="donut" src="img/donut.png" alt="donut earth portal" />
      <div id="rim"></div>

      <div class="portal-label" style="top: 440px; left: 2610px;">
        <img class="portal-thumb" src="img/wormhole_start.jpeg" alt="wormhole start" />
        <p class="portal-text">this is literally a wormhole lol</p>
      </div>


      <img id="tunnel" src="img/wormhole_tunnel.jpeg" alt="wormhole tunnel" />
    </section>


    <section id="bossfight" class="zone">
      <img id="ironman" src="img/ironman.png" alt="iron man repulsor" />
      <div class="scribble" style="left: 2840px; top: 2080px;">
        .
      </div>
    </section>


    <section id="rutgersHoop" class="zone">
      <img id="basket" src="img/basket.png" alt="rutgers hoop" />
      <div class="scribble" style="left: 1500px; top: 1430px;">
        somehow it still goes in.
      </div>
    </section>


    <section id="recycle" class="zone">
      <img id="fan" src="img/fan.png" alt="fan pointing upward" />
      <div class="scribble" style="left: 220px; top: 2280px;">
        .
      </div>
    </section>


    <img id="ball" src="img/ball.png" alt="basketball" />


    <div class="sticky-note ghost" style="top: 1560px; left: 1320px;">
      <p><span class="chip">secret:</span> scroll diagonally. the whole page is a map.</p>
    </div>

    <div class="sticky-note" style="top: 2300px; left: 2980px;">
      <p>Iron Man: "I gotchu".</p>
    </div>

  </main>
</body>
</html>
