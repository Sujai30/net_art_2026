<h1>Three Pills</h1>
<h2>Stillness</h2>
<br>
<p>The world stops offering you edges.</p>
<p>Street. Sky. Space.</p>
<p><br></p>
<p><font color="#34d399" size="6">Nothing pushes back.</font></p>
<p><br></p>
<p>You check the container.</p>
<p>It feels lighter than it should.</p>
<p><br></p>
<p>You read the last line on the label.</p>
<p><font color="#fbbf24" size="5">“THE FINAL MEMORY IS QUIET.”</font></p>
