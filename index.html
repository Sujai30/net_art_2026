<h1><font color="#fbbf24" size="7">THREE PILLS</font></h1>
<p><font size="5">You wake up already gone.</font></p>
<p>You can’t remember <em>how</em> you died.</p>
<br>
<p><font color="#34d399" size="4">On your bedside table:</font></p>
<p>a small plastic container.</p>
<p>You pick it up and read the label yourself.</p>
<hr>
<p><font color="#fbbf24" size="4">“TAKE ONE ONLY WHEN NECESSARY. MEMORY RETURNS IN FRAGMENTS.”</font></p>
<p><font color="#fbbf24" size="4">“DO NOT TAKE ALL AT ONCE.”</font></p>
