<h1><font color="#fbbf24" size="7">MEMORY</font></h1>
<h2>Lead-Up</h2>
<br>
<p>Warm light. A doorway. The idea of later.</p>
<p>Someone says, <em>“Text me when you get there.”</em></p>
<p>You say you will.</p>
<p><font color="#34d399" size="5">You remember thinking: THIS IS ORDINARY.</font></p>
<p>Because it felt ordinary, you didn’t protect it.</p>
