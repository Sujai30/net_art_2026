<h1>Three Pills</h1>
<h2><font color="#34d399">Awakening</font></h2>
<p>The room is tidy in a way that feels like an apology.</p>
<p>Shoes aligned. Jacket folded. Phone face down.</p>
<br>
<p><font size="5">You stand up and wait for your body to object.</font></p>
<p><font color="#fb7185" size="6">It doesn’t.</font></p>
<br><br>
<p>Outside, the air passes through you like you are not there.</p>
<p><small>You don’t say the word dead. Not yet.</small></p>
