<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transformation — Streetlight</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="scene" id="scene">
    <div class="sky-noise"></div>

    <div class="sun"></div>
    <div class="moon"></div>

    <div class="cloud cloud-a"></div>
    <div class="cloud cloud-b"></div>
    <div class="cloud cloud-c"></div>

    <div class="stars" aria-hidden="true">
      <span class="star s1"></span>
      <span class="star s2"></span>
      <span class="star s3"></span>
      <span class="star s4"></span>
      <span class="star s5"></span>
      <span class="star s6"></span>
      <span class="star s7"></span>
      <span class="star s8"></span>
      <span class="star s9"></span>
      <span class="star s10"></span>
      <span class="star s11"></span>
      <span class="star s12"></span>
    </div>

    <div class="horizon">
      <div class="back-hills"></div>
      <div class="city city-back">
        <span class="b1"></span>
        <span class="b2"></span>
        <span class="b3"></span>
        <span class="b4"></span>
        <span class="b5"></span>
      </div>
      <div class="city city-front">
        <span class="f1"></span>
        <span class="f2"></span>
        <span class="f3"></span>
        <span class="f4"></span>
      </div>
    </div>

    <button class="lamp" id="lamp" aria-label="Toggle day and night">
      <span class="lamp-pole"></span>
      <span class="lamp-arm"></span>
      <span class="lamp-head"></span>
      <span class="lamp-glow"></span>
      <span class="lamp-hint"></span>
    </button>

    <div class="road"></div>
    <div class="road-edge"></div>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
